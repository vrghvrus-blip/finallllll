<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#111827" />
      <stop offset="100%" stopColor="#090d16" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="50%" stopColor="#0d9488" />
      <stop offset="100%" stopColor="#042f2e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glowing border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Cosmic Neural Orb Accent in background -->
  <circle cx="256" cy="240" r="140" fill="url(#tealGrad)" opacity="0.35" filter="url(#glow)" />

  <!-- Shield Shape -->
  <path d="M 256 80 L 390 145 C 390 270 330 360 256 420 C 182 360 122 270 122 145 Z" fill="#182234" stroke="url(#tealGrad)" stroke-width="12" />

  <!-- Inner Shield Glow -->
  <path d="M 256 104 L 368 158 C 368 260 318 338 256 392 C 194 338 144 260 144 158 Z" fill="#0f172a" opacity="0.9" />

  <!-- Rupee Symbol '₹' stylized modern white with teal highlight -->
  <!-- Top horizontal bar -->
  <line x1="195" y1="180" x2="317" y2="180" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  <!-- Second horizontal bar -->
  <line x1="195" y1="225" x2="285" y2="225" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  <!-- Arc and diagonal leg -->
  <path d="M 235 180 L 235 270 C 275 270 295 245 295 215 C 295 180 265 180 235 180 Z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" />
  <path d="M 235 270 L 315 375" stroke="#2dd4bf" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 235 270 L 315 375" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />

  <!-- Top teal lightning dot -->
  <circle cx="256" cy="130" r="10" fill="#2dd4bf" filter="url(#glow)" />
</svg>
